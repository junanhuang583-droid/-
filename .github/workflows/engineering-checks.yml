name: Engineering acceptance
on:
  workflow_call:
  push:
    branches: [refactor/engineering-baseline-v1]
    paths: ['src/**', 'tests/**', 'package*.json', 'scripts/**', 'playwright.config.ts', 'vitest.config.ts', 'docs/**', 'AGENTS.md', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Rehearse deployment checker against the built application
        run: |
          mkdir -p test-results/local-deployment-check
          node scripts/serve-build.mjs > test-results/local-deployment-check/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/check-published.mjs "http://127.0.0.1:4174/-/" "$GITHUB_SHA"
          cp -r published-check/. test-results/local-deployment-check/
      - name: Record tested source and production bundle
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git archive --format=zip HEAD > test-results/source.zip
          if [ -d dist ]; then
            cp dist/build-info.json test-results/build-info.json
            tar -czf test-results/production.tar.gz -C dist .
          fi
      - name: Record dependency audit without automatic upgrades
        if: always()
        run: |
          npm audit --json > test-results/dependency-audit.json || audit_status=$?
          printf '%s\n' "${audit_status:-0}" > test-results/dependency-audit-exit-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-acceptance-${{ github.sha }}
          path: test-results
          retention-days: 14
