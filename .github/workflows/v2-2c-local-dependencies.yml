name: V2 2C isolated toolchain
on:
  push:
    branches: [work/v2-2c-integration]
    paths: [.github/workflows/v2-2c-local-dependencies.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Archive locked tools and exact source
        run: |
          tar -czf "$RUNNER_TEMP/locked-node-modules.tar.gz" node_modules
          git archive --format=zip -o "$RUNNER_TEMP/base-source.zip" HEAD
          cp package-lock.json "$RUNNER_TEMP/verified-package-lock.json"
          sha256sum "$RUNNER_TEMP/locked-node-modules.tar.gz" > "$RUNNER_TEMP/toolchain-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v2-2c-local-toolchain
          path: |
            ${{ runner.temp }}/locked-node-modules.tar.gz
            ${{ runner.temp }}/base-source.zip
            ${{ runner.temp }}/verified-package-lock.json
            ${{ runner.temp }}/toolchain-sha256.txt
          retention-days: 3
