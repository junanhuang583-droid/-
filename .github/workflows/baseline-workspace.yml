name: Baseline workspace capture

on:
  push:
    branches: [refactor/engineering-baseline-v1]
    paths: [.github/workflows/baseline-workspace.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev --save-exact @playwright/test@1.58.2
      - run: npm test
      - run: npm run build
      - name: Archive source and locked test dependencies
        run: |
          tar --exclude='./.git' -czf "$RUNNER_TEMP/baseline-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-workspace
          path: ${{ runner.temp }}/baseline-workspace.tar.gz
          retention-days: 7
